services:
  db:
    image: postgres:16-alpine
    container_name: neomarket-b2b-db
    environment:
      POSTGRES_DB: ${DB_NAME:-neomarket_b2b}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-neomarket_b2b}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: neomarket-b2b-api
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
